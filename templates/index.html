<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebuss Product Recommendation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group datalist {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 30px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            margin-top: 40px;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.5s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2em;
        }

        .recommendation-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .recommendation-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .recommendation-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .recommendation-card .info {
            color: #666;
            margin-bottom: 8px;
        }

        .recommendation-card .sentiment {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 10px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }

        .error.show {
            display: block;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .success-indicator {
            text-align: center;
            margin-bottom: 30px;
            color: #28a745;
            font-weight: 600;
            display: none;
        }

        .success-indicator.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .recommendation-card h3 {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Ebuss Product Recommendation</h1>
            <p>Get personalized product recommendations based on user sentiment analysis</p>
        </div>

        <form id="recommendationForm">
            <div class="form-group">
                <label for="username">Enter Username:</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    list="usernames"
                    placeholder="Type or select a username..."
                    required 
                />
                <datalist id="usernames"></datalist>
                <small style="color: #666; margin-top: 5px; display: block;">
                    💡 Tip: Start typing to search from available usernames
                </small>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Get Recommendations
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: #666; font-size: 1.1em;">Analyzing user preferences and generating recommendations...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="success-indicator" id="successIndicator">
            ✓ Recommendations generated successfully!
        </div>

        <div class="results" id="results">
            <h2 id="resultsTitle">Top 5 Recommended Products</h2>
            <div id="recommendationsList"></div>
        </div>
    </div>

    <script>
        // Load available usernames
        fetch('/get_users')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const datalist = document.getElementById('usernames');
                    data.users.forEach(username => {
                        const option = document.createElement('option');
                        option.value = username;
                        datalist.appendChild(option);
                    });
                }
            })
            .catch(error => {
                console.error('Error loading usernames:', error);
            });

        // Handle form submission
        document.getElementById('recommendationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const error = document.getElementById('error');
            const successIndicator = document.getElementById('successIndicator');

            // Reset UI
            loading.classList.remove('show');
            results.classList.remove('show');
            error.classList.remove('show');
            successIndicator.classList.remove('show');
            
            if (!username) {
                error.textContent = 'Please enter a username';
                error.classList.add('show');
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            loading.classList.add('show');

            try {
                const response = await fetch('/recommend', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username: username })
                });

                const data = await response.json();

                if (data.success) {
                    displayRecommendations(data);
                    successIndicator.classList.add('show');
                } else {
                    error.textContent = data.error || 'An error occurred';
                    error.classList.add('show');
                }
            } catch (error) {
                error.textContent = 'Network error. Please try again.';
                error.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        });

        function displayRecommendations(data) {
            const results = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');
            const recommendationsList = document.getElementById('recommendationsList');

            resultsTitle.textContent = `Top 5 Recommendations for ${data.username}`;
            recommendationsList.innerHTML = '';

            data.recommendations.forEach((rec, index) => {
                const card = document.createElement('div');
                card.className = 'recommendation-card';
                
                const sentimentPercent = (rec.positive_sentiment_ratio * 100).toFixed(1);
                
                card.innerHTML = `
                    <h3>${index + 1}. ${rec.product_name}</h3>
                    <div class="info"><strong>Brand:</strong> ${rec.brand}</div>
                    <div class="info"><strong>Category:</strong> ${rec.categories}</div>
                    <div class="sentiment">Positive Sentiment: ${sentimentPercent}%</div>
                `;
                
                recommendationsList.appendChild(card);
            });

            results.classList.add('show');
        }
    </script>
</body>
</html>
